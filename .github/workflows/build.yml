name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install
          # Normally sync runs build, but we bypass copy from sibling if running on github
          mkdir -p www
          # Assuming you moved the HTML files inside a 'web' folder or similar in repo
          # Or if they are pushed into www directly
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockFlow-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
